name: Validação de estabilidade — 10 baterias

on:
  push:
    branches:
      - chore/chm-101-quality-baseline

jobs:
  stability-10:
    name: 10 baterias completas
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Executar 50 baterias completas
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "::group::Bateria $i/10"
            ruff check .
            python manage.py check
            python manage.py makemigrations --check --dry-run
            python manage.py test --verbosity 0
            echo "Bateria $i/10: OK"
            echo "::endgroup::"
          done

      - name: Medir cobertura após estabilidade
        run: |
          coverage erase
          coverage run manage.py test
          coverage report
          coverage json -o coverage-stability.json

      - name: Salvar cobertura da validação
        uses: actions/upload-artifact@v4
        with:
          name: coverage-stability-10
          path: coverage-stability.json
          if-no-files-found: error
