name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes com cobertura
        run: coverage run manage.py test

      - name: Relatório de cobertura
        run: |
          coverage report
          coverage json -o coverage.json

      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: error

  postgresql:
    name: PostgreSQL 16 — integridade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chamados_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chamados_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"
      DATABASE_URL: "postgresql://postgres:postgres-ci-only@127.0.0.1:5432/chamados_ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Conferir migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Testes no PostgreSQL real
        run: coverage run manage.py test

      - name: Relatório de cobertura
        run: coverage report
