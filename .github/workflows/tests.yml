name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid spending CI minutes on superseded commits from this PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Smoke Waitress do preview protegido (somente loopback)
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m scripts.check_preview_wsgi

      - name: Testes com cobertura
        run: coverage run manage.py test

      - name: Relatório de cobertura
        run: |
          coverage report
          coverage json -o coverage.json

      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: error

  postgresql:
    name: PostgreSQL 16 — integridade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chamados_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chamados_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"
      DATABASE_URL: "postgresql://postgres:postgres-ci-only@127.0.0.1:5432/chamados_ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Conferir migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations em PostgreSQL
        run: python manage.py migrate --noinput

      - name: Conferir schema migrado
        run: python manage.py migrate --check

      - name: Smoke test readiness PostgreSQL
        run: |
          python manage.py shell -c "from django.db import connection; from django.test import Client; assert connection.vendor == 'postgresql'; r = Client().get('/api/health/ready/'); assert r.status_code == 200; assert r.json()['status'] == 'ok'"

      - name: Testes no PostgreSQL real
        run: coverage run manage.py test

      - name: Relatório de cobertura
        run: coverage report

  celery_worker:
    name: Redis + Celery — integração real no runner
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-with-adequate-length"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar Redis da distribuição (sem Docker Hub)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start
          redis-cli ping

      - name: Instalar dependências Python
        run: python -m pip install -r requirements-dev.txt

      - name: Validar Compose sem baixar imagens
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validar credenciais de desenvolvimento do Compose
        run: |
          python - <<'PY'
          import json
          import subprocess
          from urllib.parse import unquote, urlsplit

          raw = subprocess.check_output(["docker", "compose", "config", "--format", "json"], text=True)
          conf = json.loads(raw)
          db_password = conf["services"]["db"]["environment"]["POSTGRES_PASSWORD"]
          for service in ("api", "worker"):
              url = conf["services"][service]["environment"]["DATABASE_URL"]
              assert unquote(urlsplit(url).password or "") == db_password, "Compose DB password mismatch"
          PY

      - name: Aplicar migrations em SQLite de integração
        run: python manage.py migrate --noinput

      - name: Iniciar worker Celery real
        run: |
          celery -A chamados_api worker --loglevel=WARNING --concurrency=1 --pool=solo > /tmp/chamados-celery.log 2>&1 &
          echo $! > /tmp/chamados-celery.pid

      - name: Executar tarefa no broker Redis real
        run: |
          for attempt in $(seq 1 20); do
            if python manage.py shell -c "from tickets.tasks import ticket_queue_summary; r = ticket_queue_summary.delay().get(timeout=5); assert r['total'] == 0, r; assert set(r['by_status']) == {'open', 'in_progress', 'waiting', 'resolved', 'closed'}; print('Celery + Redis: OK')"; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/chamados-celery.log
          exit 1

      - name: Enviar e processar notificação no worker real
        run: |
          python manage.py shell -c "from django.contrib.auth import get_user_model; from tickets.models import NotificationOutbox, TicketNotification; from tickets.tasks import deliver_pending_notifications; user, _ = get_user_model().objects.get_or_create(username='ci-notification-recipient'); NotificationOutbox.objects.create(recipient=user, kind='ticket_created', ticket_reference='CH-000001'); result = deliver_pending_notifications.delay().get(timeout=30); assert result['processed'] == 1, result; assert TicketNotification.objects.filter(recipient=user).count() == 1; print('Notification outbox: OK')"

      - name: Iniciar API HTTP no runner
        run: |
          gunicorn chamados_api.wsgi:application --bind 127.0.0.1:8000 --workers 2 --access-logfile - --error-logfile - > /tmp/chamados-api.log 2>&1 &
          echo $! > /tmp/chamados-api.pid
          for attempt in $(seq 1 20); do
            if python scripts/smoke_deploy.py http://127.0.0.1:8000 --allow-http-local; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/chamados-api.log
          exit 1

      - name: Capturar tela real do Swagger com Chrome headless
        run: |
          mkdir -p release-artifacts
          command -v google-chrome
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,1000 --virtual-time-budget=10000 \
            --screenshot="$PWD/release-artifacts/swagger-real-ci.png" \
            "http://127.0.0.1:8000/api/docs/" >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          p = Path("release-artifacts/swagger-real-ci.png")
          data = p.read_bytes()
          assert data.startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10])), "Screenshot PNG invalida"
          assert len(data) > 16000, "Imagem pequena demais, possivel tela vazia"
          print(f"Swagger CI screenshot generated: {len(data)} bytes")
          PY

      - name: Salvar evidencia visual real da API
        uses: actions/upload-artifact@v4
        with:
          name: swagger-ci-capture
          path: release-artifacts/swagger-real-ci.png
          if-no-files-found: error
          retention-days: 30

      - name: Log de diagnostico
        if: failure()
        run: |
          cat /tmp/chamados-celery.log || true
          cat /tmp/chamados-api.log || true

      - name: Encerrar processos do runner
        if: always()
        run: |
          if test -f /tmp/chamados-celery.pid; then kill "$(cat /tmp/chamados-celery.pid)" || true; fi
          if test -f /tmp/chamados-api.pid; then kill "$(cat /tmp/chamados-api.pid)" || true; fi

  railway_iac:
    name: Railway IaC — TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar ferramentas de infraestrutura
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verificar tipagem da configuracao Railway
        run: npm run check:railway

  local_release:
    name: Publicar pré-release local (somente commit explicitamente marcado)
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v1.0.0-local.1') }}"
    needs: [quality, postgresql, celery_worker, railway_iac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Baixar screenshot real gerada no CI
        uses: actions/download-artifact@v4
        with:
          name: swagger-ci-capture
          path: release-artifacts

      - name: Verificar asset antes de liberar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release-artifacts/swagger-real-ci.png
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short
          if gh release view v1.0.0-local.1 > /dev/null 2>&1; then
            echo "A release ja existe; nao substituir tag publicada."
            exit 1
          fi

      - name: Criar tag e pré-release com asset real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-local.1 release-artifacts/swagger-real-ci.png \
            --target "${GITHUB_SHA}" \
            --title "Chamados API v1.0.0-local.1 — Local Demo" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease \
            --latest=false
